<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">

<title>Criador IA</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080b14;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

.app{
max-width:900px;
margin:auto;
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
height:70px;
display:flex;
align-items:center;
padding:12px 18px;
border-bottom:1px solid #20283b;
background:#0b0f1b;
position:sticky;
top:0;
z-index:10;
}

.logo{
width:44px;
height:44px;
border-radius:14px;
background:linear-gradient(135deg,#765cff,#9b5cff);
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
margin-right:12px;
}

.title{
font-size:20px;
font-weight:bold;
}

.subtitle{
font-size:12px;
color:#8994aa;
margin-top:3px;
}

.status{
margin-left:auto;
font-size:12px;
color:#ffb84d;
}

#chat{
padding:20px 15px 190px;
}

.welcome{
text-align:center;
padding:45px 15px;
}

.biglogo{
font-size:50px;
}

.welcome h2{
font-size:28px;
margin:12px 0 8px;
}

.welcome p{
color:#8994aa;
}

.message{
display:flex;
margin:16px 0;
}

.message.user{
justify-content:flex-end;
}

.bubble{
max-width:88%;
padding:13px 16px;
border-radius:18px;
line-height:1.5;
font-size:15px;
}

.user .bubble{
background:#765cff;
border-bottom-right-radius:5px;
}

.ai .bubble{
background:#141b2b;
border:1px solid #252f45;
border-bottom-left-radius:5px;
}

.creation{
margin-top:10px;
background:#0d1321;
border:1px solid #2a3650;
border-radius:18px;
padding:12px;
}

.creation-title{
font-weight:bold;
margin-bottom:10px;
}

.creation-content{
background:#070b13;
border-radius:14px;
overflow:hidden;
min-height:100px;
display:flex;
align-items:center;
justify-content:center;
}

.creation-content img{
width:100%;
max-height:650px;
object-fit:contain;
display:block;
}

.creation-content video{
width:100%;
max-height:650px;
display:block;
}

.creation-content audio{
width:100%;
}

.loading{
padding:35px 15px;
text-align:center;
color:#9ba8bf;
}

.spinner{
width:32px;
height:32px;
border:3px solid #303b55;
border-top-color:#765cff;
border-radius:50%;
margin:0 auto 12px;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.actions{
display:flex;
gap:8px;
margin-top:10px;
}

.actions a,
.actions button{
flex:1;
text-align:center;
text-decoration:none;
}

button{
border:1px solid #34415c;
background:#182238;
color:#fff;
border-radius:12px;
padding:10px 13px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#222f49;
}

.send{
margin-left:auto;
background:#765cff;
border:0;
font-size:17px;
}

.tools{
display:flex;
gap:7px;
overflow-x:auto;
padding:10px 0 2px;
}

.tools button{
white-space:nowrap;
font-size:12px;
padding:9px 11px;
}

.tools button.active{
background:#765cff;
border-color:#765cff;
}

.composer-area{
position:fixed;
bottom:0;
left:0;
right:0;
background:linear-gradient(transparent,#080b14 20%);
padding:25px 12px 14px;
z-index:20;
}

.composer{
max-width:900px;
margin:auto;
background:#111827;
border:1px solid #303c55;
border-radius:20px;
padding:10px;
}

textarea{
width:100%;
height:65px;
resize:none;
border:0;
outline:0;
background:transparent;
color:white;
font-size:16px;
padding:8px;
font-family:Arial;
}

textarea::placeholder{
color:#69758c;
}

.composer-buttons{
display:flex;
gap:8px;
align-items:center;
}

.file-preview{
display:none;
margin:8px 0;
background:#0a0f1b;
border-radius:12px;
padding:8px;
}

.file-preview img,
.file-preview video{
width:100%;
max-height:160px;
object-fit:contain;
border-radius:9px;
}

#connect{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
display:none;
align-items:center;
justify-content:center;
z-index:100;
padding:20px;
}

.modal{
background:#111827;
border:1px solid #34415c;
border-radius:22px;
padding:25px;
max-width:420px;
width:100%;
text-align:center;
}

.modal h2{
margin-top:0;
}

.modal p{
color:#9ba8bf;
line-height:1.5;
}

.connectButton{
width:100%;
background:#765cff;
border:0;
margin-top:10px;
}

.closeButton{
width:100%;
margin-top:8px;
}

@media(max-width:600px){

header{
height:62px;
}

.title{
font-size:18px;
}

#chat{
padding-left:10px;
padding-right:10px;
}

.bubble{
max-width:94%;
}

}

</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">✨</div>

<div>
<div class="title">Criador IA</div>
<div class="subtitle">
Crie imagens, vídeos, textos e muito mais
</div>
</div>

<div
class="status"
id="status">
🔴 Desconectado
</div>

</header>


<main id="chat">

<div
class="welcome"
id="welcome">

<div class="biglogo">✨</div>

<h2>Como posso ajudar?</h2>

<p>
Conecte sua IA e diga o que você quer criar.
</p>

<button
onclick="openConnect()">
🔐 Conectar IA
</button>

</div>

</main>


<div class="composer-area">

<div class="composer">

<div
class="file-preview"
id="filePreview">
</div>

<textarea
id="prompt"
placeholder="Diga o que você quer criar..."
></textarea>

<div class="tools">

<button data-mode="chat">💬 Chat</button>

<button data-mode="image">🖼️ Imagem</button>

<button data-mode="video">🎬 Vídeo</button>

<button data-mode="text">✍️ Texto</button>

<button data-mode="audio">🎵 Áudio</button>

</div>

<div class="composer-buttons">

<button id="attach">📎</button>

<input
type="file"
id="file"
accept="image/*,video/*"
style="display:none"
>

<button id="mic">🎤</button>

<button id="clear">🗑️</button>

<button
class="send"
id="send">
➤
</button>

</div>

</div>

</div>

</div>


<div id="connect">

<div class="modal">

<h2>🔐 Conectar IA</h2>

<p>
Para usar a inteligência artificial, conecte sua conta Pollinations.
Você continuará no controle do seu orçamento e da autorização.
</p>

<button
class="connectButton"
onclick="startLogin()">
🚀 Conectar agora
</button>

<button
class="closeButton"
onclick="closeConnect()">
Cancelar
</button>

</div>

</div>


<script>

/* =========================================
   CONFIGURAÇÃO
========================================= */

const CLIENT_ID =
pk_e3dlTjF2KpyiLMWx;

const REDIRECT_URI =
"https://dicasdecursosonlineparamelhora-source.github.io/CriadorIA/";


/* =========================================
   ELEMENTOS
========================================= */

const promptInput =
document.getElementById("prompt");

const chat =
document.getElementById("chat");

const welcome =
document.getElementById("welcome");

const status =
document.getElementById("status");

const file =
document.getElementById("file");

const filePreview =
document.getElementById("filePreview");

let currentMode = "chat";

let selectedFile = null;

let accessToken = null;


/* =========================================
   PKCE
========================================= */

function randomString(length=64){

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

let result="";

const values =
new Uint8Array(length);

crypto.getRandomValues(values);

for(let i=0;i<length;i++){

result +=
chars[values[i] % chars.length];

}

return result;

}


function base64url(buffer){

return btoa(
String.fromCharCode(
...new Uint8Array(buffer)
)
)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=/g,"");

}


async function sha256(text){

const data =
new TextEncoder().encode(text);

return crypto.subtle.digest(
"SHA-256",
data
);

}


/* =========================================
   CONECTAR
========================================= */

function openConnect(){

document.getElementById("connect").style.display =
"flex";

}


function closeConnect(){

document.getElementById("connect").style.display =
"none";

}


async function startLogin(){

if(!CLIENT_ID ||
CLIENT_ID.includes("COLE_")){

alert(
"Primeiro coloque sua nova App Key no código."
);

return;

}

const verifier =
randomString();

const challenge =
base64url(
await sha256(verifier)
);

const state =
randomString(32);

sessionStorage.setItem(
"pkce_verifier",
verifier
);

sessionStorage.setItem(
"oauth_state",
state
);

const params =
new URLSearchParams({

response_type:"code",

client_id:CLIENT_ID,

redirect_uri:REDIRECT_URI,

scope:"profile usage",

state:state,

code_challenge:challenge,

code_challenge_method:"S256",

expiry:"7"

});


window.location.href =
"https://enter.pollinations.ai/authorize?"
+params.toString();

}


/* =========================================
   RETORNO DO LOGIN
========================================= */

async function handleCallback(){

const params =
new URLSearchParams(
window.location.search
);

const code =
params.get("code");

const state =
params.get("state");

if(!code)
return;

const savedState =
sessionStorage.getItem(
"oauth_state"
);

if(!state ||
state !== savedState){

alert(
"Erro de segurança na autorização."
);

return;

}

const verifier =
sessionStorage.getItem(
"pkce_verifier"
);

try{

status.textContent =
"🟡 Conectando...";

const response =
await fetch(
"https://enter.pollinations.ai/api/oauth/token",
{

method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body:new URLSearchParams({

grant_type:
"authorization_code",

code:code,

client_id:
CLIENT_ID,

redirect_uri:
REDIRECT_URI,

code_verifier:
verifier

})

}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Não foi possível autorizar."
);

}

accessToken =
data.access_token;

sessionStorage.setItem(
"criador_ia_token",
accessToken
);

sessionStorage.removeItem(
"pkce_verifier"
);

sessionStorage.removeItem(
"oauth_state"
);

window.history.replaceState(
{},
document.title,
REDIRECT_URI
);

status.textContent =
"🟢 IA conectada";

welcome.style.display =
"none";

addAIMessage(
"✅ IA conectada! Agora você pode pedir para criar uma imagem, vídeo, texto ou áudio."
);

}catch(error){

console.error(error);

status.textContent =
"🔴 Erro";

addAIMessage(
"❌ Não consegui conectar à IA: "
+error.message
);

}

}


/* =========================================
   RECUPERAR TOKEN
========================================= */

function loadToken(){

const token =
sessionStorage.getItem(
"criador_ia_token"
);

if(token){

accessToken =
token;

status.textContent =
"🟢 IA conectada";

welcome.style.display =
"none";

}

}


/* =========================================
   MENSAGENS
========================================= */

function addUserMessage(text){

welcome.style.display =
"none";

const message =
document.createElement("div");

message.className =
"message user";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

message.appendChild(bubble);

chat.appendChild(message);

scrollBottom();

}


function addAIMessage(text){

const message =
document.createElement("div");

message.className =
"message ai";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

bubble.textContent =
text;

message.appendChild(bubble);

chat.appendChild(message);

scrollBottom();

}


/* =========================================
   RESULTADO
========================================= */

function createCreation(){

const message =
document.createElement("div");

message.className =
"message ai";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

const box =
document.createElement("div");

box.className =
"creation";

box.innerHTML = `

<div class="creation-title">
✨ Resultado da criação
</div>

<div class="creation-content">

<div class="loading">

<div class="spinner"></div>

<div>
Gerando...
</div>

</div>

</div>

`;

bubble.appendChild(box);

message.appendChild(bubble);

chat.appendChild(message);

scrollBottom();

return box;

}


/* =========================================
   GERAR IMAGEM
========================================= */

async function generateImage(prompt){

const box =
createCreation();

const content =
box.querySelector(
".creation-content"
);

try{

const encoded =
encodeURIComponent(prompt);

const url =
"https://gen.pollinations.ai/image/"
+encoded
+"?model=flux";

const response =
await fetch(url,{

headers:{
"Authorization":
"Bearer "+accessToken
}

});

if(!response.ok){

throw new Error(
"Erro HTTP "
+response.status
);

}

const blob =
await response.blob();

const imageUrl =
URL.createObjectURL(blob);

content.innerHTML = "";

const img =
document.createElement("img");

img.src =
imageUrl;

content.appendChild(img);

const actions =
document.createElement("div");

actions.className =
"actions";

const open =
document.createElement("a");

open.href =
imageUrl;

open.target =
"_blank";

open.textContent =
"🔎 Abrir";

open.style.background =
"#182238";

open.style.padding =
"11px";

open.style.borderRadius =
"12px";

open.style.color =
"white";

const save =
document.createElement("a");

save.href =
imageUrl;

save.download =
"criador-ia.png";

save.textContent =
"⬇️ Salvar";

save.style.background =
"#765cff";

save.style.padding =
"11px";

save.style.borderRadius =
"12px";

save.style.color =
"white";

actions.appendChild(open);

actions.appendChild(save);

box.appendChild(actions);

}catch(error){

console.error(error);

content.innerHTML = `

<div class="loading">

❌ Não foi possível gerar a imagem.

<br><br>

${error.message}

</div>

`;

}

}


/* =========================================
   CHAT
========================================= */

async function generateText(prompt){

const box =
createCreation();

const content =
box.querySelector(
".creation-content"
);

try{

const response =
await fetch(
"https://gen.pollinations.ai/v1/chat/completions",
{

method:"POST",

headers:{

"Authorization":
"Bearer "+accessToken,

"Content-Type":
"application/json"

},

body:JSON.stringify({

model:
"openai/gpt-5.4-nano",

messages:[

{
role:"user",
content:prompt
}

]

})

}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error?.message ||
"Erro na IA"
);

}

const text =
data.choices?.[0]?.message?.content ||
"Sem resposta.";

content.innerHTML = "";

const div =
document.createElement("div");

div.style.padding =
"18px";

div.style.whiteSpace =
"pre-wrap";

div.textContent =
text;

content.appendChild(div);

}catch(error){

content.innerHTML = `

<div class="loading">

❌ Erro:

<br><br>

${error.message}

</div>

`;

}

}


/* =========================================
   EXECUTAR
========================================= */

document
.getElementById("send")
.onclick = async () => {

const text =
promptInput.value.trim();

if(!text)
return;

if(!accessToken){

openConnect();

return;

}

addUserMessage(text);

promptInput.value = "";


if(currentMode === "image"){

await generateImage(text);

return;

}


await generateText(text);

};


/* =========================================
   ENTER
========================================= */

promptInput.addEventListener(
"keydown",
event => {

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

document
.getElementById("send")
.click();

}

});


/* =========================================
   MODOS
========================================= */

document
.querySelectorAll(".tools button")
.forEach(button => {

button.onclick = () => {

document
.querySelectorAll(".tools button")
.forEach(b =>
b.classList.remove("active")
);

button.classList.add("active");

currentMode =
button.dataset.mode;

const placeholders = {

chat:
"Converse com a IA...",

image:
"Descreva a imagem que você quer criar...",

video:
"Descreva o vídeo que você quer criar...",

text:
"Digite o texto que você quer criar...",

audio:
"Descreva o áudio que você quer criar..."

};

promptInput.placeholder =
placeholders[currentMode];

promptInput.focus();

};

});


/* =========================================
   ARQUIVO
========================================= */

document
.getElementById("attach")
.onclick = () => {

file.click();

};


file.onchange = () => {

const f =
file.files[0];

if(!f)
return;

selectedFile =
f;

filePreview.style.display =
"block";

filePreview.innerHTML = "";

const url =
URL.createObjectURL(f);

if(
f.type.startsWith("image/")
){

const img =
document.createElement("img");

img.src =
url;

filePreview.appendChild(img);

}

if(
f.type.startsWith("video/")
){

const video =
document.createElement("video");

video.src =
url;

video.controls =
true;

filePreview.appendChild(video);

}

};


/* =========================================
   LIMPAR
========================================= */

document
.getElementById("clear")
.onclick = () => {

promptInput.value = "";

file.value = "";

filePreview.style.display =
"none";

filePreview.innerHTML = "";

chat.innerHTML = "";

chat.appendChild(welcome);

welcome.style.display =
"block";

};


/* =========================================
   MICROFONE
========================================= */

document
.getElementById("mic")
.onclick = () => {

const Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!Recognition){

alert(
"Reconhecimento de voz não disponível."
);

return;

}

const recognition =
new Recognition();

recognition.lang =
"pt-BR";

recognition.start();

recognition.onresult =
event => {

promptInput.value =
event.results[0][0].transcript;

};

};


/* =========================================
   INICIALIZAÇÃO
========================================= */

handleCallback();

loadToken();

</script>

</body>
</html>
