<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b14">

<title>Criador IA</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080b14;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

.app{
max-width:900px;
margin:auto;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* TOPO */

header{
height:70px;
display:flex;
align-items:center;
padding:12px 18px;
border-bottom:1px solid #20283b;
background:#0b0f1b;
position:sticky;
top:0;
z-index:10;
}

.logo{
width:44px;
height:44px;
border-radius:14px;
background:linear-gradient(135deg,#765cff,#9b5cff);
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
margin-right:12px;
}

.title{
font-size:20px;
font-weight:bold;
}

.subtitle{
font-size:12px;
color:#8994aa;
margin-top:3px;
}

/* CHAT */

#chat{
flex:1;
padding:20px 15px 170px;
}

.welcome{
text-align:center;
padding:45px 15px;
}

.welcome .biglogo{
font-size:50px;
margin-bottom:12px;
}

.welcome h2{
margin:0 0 8px;
font-size:28px;
}

.welcome p{
color:#8994aa;
font-size:14px;
}

/* MENSAGENS */

.message{
display:flex;
margin:16px 0;
}

.message.user{
justify-content:flex-end;
}

.bubble{
max-width:85%;
padding:13px 16px;
border-radius:18px;
line-height:1.5;
font-size:15px;
}

.user .bubble{
background:#765cff;
border-bottom-right-radius:5px;
}

.ai .bubble{
background:#141b2b;
border:1px solid #252f45;
border-bottom-left-radius:5px;
}

/* RESULTADO */

.creation{
margin-top:12px;
background:#0d1321;
border:1px solid #2a3650;
border-radius:20px;
padding:15px;
}

.creation-title{
font-weight:bold;
font-size:15px;
margin-bottom:12px;
color:#dce4f5;
}

.creation-content{
background:#080c16;
border-radius:15px;
overflow:hidden;
min-height:80px;
display:flex;
align-items:center;
justify-content:center;
}

.creation-content img{
width:100%;
display:block;
max-height:650px;
object-fit:contain;
}

.creation-content video{
width:100%;
max-height:650px;
display:block;
}

.creation-content audio{
width:100%;
}

.loading{
padding:35px 15px;
text-align:center;
color:#9ba8bf;
}

.spinner{
width:32px;
height:32px;
border:3px solid #303b55;
border-top-color:#765cff;
border-radius:50%;
margin:0 auto 12px;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.actions{
display:flex;
gap:8px;
margin-top:10px;
}

.actions button{
flex:1;
}

/* COMPOSER */

.composer-area{
position:fixed;
bottom:0;
left:0;
right:0;
background:linear-gradient(transparent,#080b14 18%);
padding:25px 12px 14px;
z-index:20;
}

.composer{
max-width:900px;
margin:auto;
background:#111827;
border:1px solid #303c55;
border-radius:20px;
padding:10px;
box-shadow:0 -10px 30px rgba(0,0,0,.25);
}

textarea{
width:100%;
height:65px;
resize:none;
border:0;
outline:0;
background:transparent;
color:white;
font-size:16px;
padding:8px;
font-family:Arial;
}

textarea::placeholder{
color:#69758c;
}

.composer-buttons{
display:flex;
align-items:center;
gap:8px;
}

button{
border:1px solid #34415c;
background:#182238;
color:#fff;
border-radius:12px;
padding:10px 13px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#222f49;
}

.send{
margin-left:auto;
background:#765cff;
border:0;
font-size:17px;
}

.send:hover{
background:#674bea;
}

/* FERRAMENTAS */

.tools{
display:flex;
gap:7px;
overflow-x:auto;
padding:10px 0 2px;
}

.tools button{
white-space:nowrap;
font-size:12px;
padding:9px 11px;
}

.tools button.active{
background:#765cff;
border-color:#765cff;
}

/* ARQUIVO */

.file-preview{
display:none;
margin:8px 0;
background:#0a0f1b;
border-radius:12px;
padding:8px;
}

.file-preview img,
.file-preview video{
width:100%;
max-height:160px;
object-fit:contain;
border-radius:9px;
}

/* RESPONSIVO */

@media(max-width:600px){

header{
height:62px;
}

.title{
font-size:18px;
}

#chat{
padding-left:10px;
padding-right:10px;
}

.bubble{
max-width:92%;
}

.welcome h2{
font-size:24px;
}

}

</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">✨</div>

<div>
<div class="title">Criador IA</div>
<div class="subtitle">Crie imagens, vídeos, textos e muito mais</div>
</div>

</header>


<main id="chat">

<div class="welcome" id="welcome">

<div class="biglogo">✨</div>

<h2>Como posso ajudar?</h2>

<p>
Digite o que você quer criar abaixo.
</p>

</div>

</main>


<div class="composer-area">

<div class="composer">

<div
class="file-preview"
id="filePreview">
</div>


<textarea
id="prompt"
placeholder="Diga o que você quer criar..."
></textarea>


<div class="tools">

<button data-mode="chat">💬 Chat</button>

<button data-mode="image">🖼️ Imagem</button>

<button data-mode="video">🎬 Vídeo</button>

<button data-mode="text">✍️ Texto</button>

<button data-mode="audio">🎵 Áudio</button>

</div>


<div class="composer-buttons">

<label>

<button
type="button"
id="attach">
📎
</button>

<input
type="file"
id="file"
accept="image/*,video/*"
style="display:none"
>

</label>


<button
type="button"
id="mic">
🎤
</button>


<button
type="button"
id="clear">
🗑️
</button>


<button
type="button"
class="send"
id="send">
➤
</button>

</div>

</div>

</div>

</div>


<script>

const promptInput =
document.getElementById("prompt");

const chat =
document.getElementById("chat");

const welcome =
document.getElementById("welcome");

const file =
document.getElementById("file");

const filePreview =
document.getElementById("filePreview");

const send =
document.getElementById("send");

const clear =
document.getElementById("clear");

const attach =
document.getElementById("attach");

const mic =
document.getElementById("mic");

let currentMode = "chat";

let selectedFile = null;


/* ESCOLHER MODO */

document
.querySelectorAll(".tools button")
.forEach(button => {

button.onclick = () => {

document
.querySelectorAll(".tools button")
.forEach(b =>
b.classList.remove("active")
);

button.classList.add("active");

currentMode =
button.dataset.mode;

const names = {

chat:
"Digite sua pergunta...",

image:
"Descreva a imagem que você quer criar...",

video:
"Descreva o vídeo que você quer criar...",

text:
"Digite o texto que você quer criar...",

audio:
"Digite o áudio que você quer criar..."

};

promptInput.placeholder =
names[currentMode];

promptInput.focus();

};

});


/* ANEXAR */

attach.onclick = () => {

file.click();

};


file.onchange = () => {

const f =
file.files[0];

if(!f)
return;

selectedFile = f;

filePreview.style.display =
"block";

filePreview.innerHTML = "";

const url =
URL.createObjectURL(f);

if(f.type.startsWith("image/")){

const img =
document.createElement("img");

img.src = url;

filePreview.appendChild(img);

}else if(f.type.startsWith("video/")){

const video =
document.createElement("video");

video.src = url;

video.controls = true;

filePreview.appendChild(video);

}

};


/* ADICIONAR MENSAGEM */

function addUserMessage(text){

welcome.style.display =
"none";

const message =
document.createElement("div");

message.className =
"message user";

message.innerHTML =
`<div class="bubble">${escapeHtml(text)}</div>`;

chat.appendChild(message);

scrollBottom();

}


/* RESPOSTA IA */

function addAIMessage(text){

const message =
document.createElement("div");

message.className =
"message ai";

message.innerHTML =
`<div class="bubble">${escapeHtml(text)}</div>`;

chat.appendChild(message);

scrollBottom();

}


/* RESULTADO */

function createResult(){

const message =
document.createElement("div");

message.className =
"message ai";

const bubble =
document.createElement("div");

bubble.className =
"bubble";

const creation =
document.createElement("div");

creation.className =
"creation";

creation.innerHTML = `

<div class="creation-title">
✨ Resultado da criação
</div>

<div class="creation-content">

<div class="loading">

<div class="spinner"></div>

<div>Gerando sua criação...</div>

</div>

</div>

`;

bubble.appendChild(creation);

message.appendChild(bubble);

chat.appendChild(message);

scrollBottom();

return creation;

}


/* ESCAPE */

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
text;

return div.innerHTML;

}


/* ROLAR */

function scrollBottom(){

setTimeout(() => {

window.scrollTo({

top:document.body.scrollHeight,

behavior:"smooth"

});

},50);

}


/* EXECUTAR */

send.onclick =
async () => {

const text =
promptInput.value.trim();

if(!text){

promptInput.focus();

return;

}

addUserMessage(text);

promptInput.value = "";


/*
ATENÇÃO:

AQUI É ONDE VAI ENTRAR
A CONEXÃO REAL COM A API.

A INTERFACE JÁ POSSUI O
ESPAÇO REAL PARA MOSTRAR
IMAGEM, VÍDEO, ÁUDIO OU TEXTO.
*/

if(currentMode === "image"){

const result =
createResult();

const content =
result.querySelector(
".creation-content"
);

content.innerHTML = `

<div class="loading">

<div class="spinner"></div>

<div>
Preparando geração da imagem...
</div>

</div>

`;


/*
A conexão segura com a API
será adicionada aqui.
*/

setTimeout(() => {

content.innerHTML = `

<div class="loading">

<div>⚙️</div>

<div>
A conexão da IA ainda precisa
ser autorizada neste aplicativo.
</div>

</div>

`;

},1000);

return;

}


if(currentMode === "video"){

const result =
createResult();

const content =
result.querySelector(
".creation-content"
);

content.innerHTML = `

<div class="loading">

<div class="spinner"></div>

<div>
Preparando geração do vídeo...
</div>

</div>

`;

return;

}


if(currentMode === "audio"){

const result =
createResult();

const content =
result.querySelector(
".creation-content"
);

content.innerHTML = `

<div class="loading">

<div class="spinner"></div>

<div>
Preparando geração do áudio...
</div>

</div>

`;

return;

}


/* CHAT/TEXTO */

addAIMessage(
"Recebi seu comando. A conexão com o modelo de IA será usada aqui."
);

};


/* ENTER */

promptInput.addEventListener(
"keydown",
e => {

if(e.key === "Enter" && !e.shiftKey){

e.preventDefault();

send.click();

}

});


/* LIMPAR */

clear.onclick = () => {

promptInput.value = "";

file.value = "";

selectedFile = null;

filePreview.style.display =
"none";

filePreview.innerHTML = "";

chat.innerHTML = "";

chat.appendChild(welcome);

welcome.style.display =
"block";

};


/* MICROFONE */

mic.onclick = () => {

const Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!Recognition){

alert(
"Seu navegador não oferece reconhecimento de voz."
);

return;

}

const recognition =
new Recognition();

recognition.lang =
"pt-BR";

recognition.start();

recognition.onresult =
event => {

promptInput.value =
event.results[0][0].transcript;

};

};

</script>

</body>
</html>
